<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webpage Snapshot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="card">
    <!-- 可见文案一律由 popup.js 从 i18n 词典填充，避免硬编码语言 -->
    <h1 id="i18n-title"></h1>
    <p class="desc" id="i18n-description"></p>
    <button id="start" type="button"></button>
    <p id="status" class="status" role="status"></p>
    <p class="tips">
      <span id="i18n-tipFormats"></span>
      <span id="i18n-tipEsc"></span>
      <span id="i18n-tipDownload"></span>
    </p>
  </main>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
